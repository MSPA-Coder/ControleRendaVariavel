# Vhost do ControleRendaVariavel. Cópia de /etc/nginx/sites-available/controle-renda-variavel.
#
# Os quatro vhosts têm estrutura idêntica de propósito: só mudam domínio,
# porta e tamanho máximo de corpo. Cabeçalho de proxy fica em
# `snippets/proxy-app.conf`, compressão e limitador em `conf.d/00-comum.conf`.

server {
    listen 80;
    listen [::]:80;
    server_name renda-mspa.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... ssl http2` e não `http2 on;`: a diretiva separada só existe a
    # partir do nginx 1.25.1, e aqui roda 1.24.0. Conferido no servidor antes
    # de escrever -- a forma nova falharia ao recarregar.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name renda-mspa.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/renda-mspa.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/renda-mspa.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Força bruta no login. A zona e a explicação estão em
    # `conf.d/00-comum.conf`; aqui só se escolhe a folga.
    #
    # Regex e não `location = /login` porque os quatro não concordam sobre a
    # barra final -- o `APPEND_SLASH` do Django aceita as duas formas, e uma
    # rota de login que escapasse do limitador por causa de uma barra seria um
    # buraco silencioso.
    #
    # Nenhum `add_header` aqui dentro de propósito: um `add_header` local faz o
    # nginx DESCARTAR os do bloco pai, e o HSTS acima sumiria só nesta rota.
    location ~ ^/login/?$ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5301;
        include snippets/proxy-app.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:5301;
        include snippets/proxy-app.conf;
    }
}
