# Exclusivo de deploy.sh. O deploy monta as imagens no VPS a partir do commit
# (as bases vão por tag; base nova só com `--refresh`) e passa o ID local de
# cada uma; este arquivo sobe por esse ID, sem reconstruir nem baixar.
services:
  web:
    image: ${APP_IMAGE:?deploy.sh deve fornecer APP_IMAGE por ID}
    pull_policy: never
  migrate:
    image: ${APP_IMAGE:?deploy.sh deve fornecer APP_IMAGE por ID}
    pull_policy: never
  db:
    image: ${POSTGRES_IMAGE:?deploy.sh deve fornecer POSTGRES_IMAGE por ID}
    pull_policy: never
  db-provision:
    image: ${POSTGRES_IMAGE:?deploy.sh deve fornecer POSTGRES_IMAGE por ID}
    pull_policy: never
