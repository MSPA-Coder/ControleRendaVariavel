# Overrides de desenvolvimento: monta o código do host via bind mount para
# edição ao vivo, na mesma porta do serviço `web`.
#
# ESTE ARQUIVO NÃO É MESCLADO AUTOMATICAMENTE. O Compose só lê sozinho
# `compose.override.yaml`; um arquivo com este nome exige `-f` explícito:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up
#
# Portanto `docker compose up --build` reconstrói a imagem atual, com cache e
# sem código do host. A CI testa e audita as atualizações antes de integrá-las.

services:
  web:
    volumes:
      - .:/app
