name: controle-renda-variavel

services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: postgres
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    read_only: true
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: investimentos
      POSTGRES_USER: investimentos
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5302:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investimentos -d investimentos"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    # Nome fixo em vez do derivado do diretorio. Sem isto o Compose batiza a
    # imagem a partir do nome da pasta, que muda conforme onde o repositorio
    # foi clonado -- no CI seria um nome, no VPS outro. A varredura de
    # vulnerabilidade precisa apontar para uma imagem por NOME, e nome que
    # depende do caminho do checkout nao serve de alvo.
    image: controle-renda-variavel:local
    build:
      context: .
      target: runtime
      secrets:
        - local_ca
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # O dia de negocio e o de Sao Paulo. Sem isto o conteiner roda em UTC e
      # todo `date.today()` do app vira o dia seguinte entre 21h e 24h: um
      # ajuste de posicao feito na noite do ultimo dia do mes cairia no mes
      # seguinte. Os outros apps do VPS declaram o mesmo.
      TZ: America/Sao_Paulo
      SECRET_KEY_FILE: /run/secrets/secret_key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password
      COLLECTOR_AGENT_READ_TOKEN_FILE: /run/secrets/collector_agent_read_token
      COLLECTOR_AGENT_WRITE_TOKEN_FILE: /run/secrets/collector_agent_write_token
      # Publicacao do resumo de patrimonio, lida pelo consolidador. As duas
      # andam juntas: sem token a rota nao autentica, sem titular ela nao sabe
      # de quem e o dinheiro que publica.
      PATRIMONIO_TOKEN_FILE: /run/secrets/patrimonio_token
      PATRIMONIO_TITULAR: ${PATRIMONIO_TITULAR:-}
      PATRIMONIO_OWNER_ID: ${PATRIMONIO_OWNER_ID:-}
      PATRIMONIO_MAX_HISTORICO_DIAS: ${PATRIMONIO_MAX_HISTORICO_DIAS:-3650}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: investimentos
      POSTGRES_USER: investimentos_app
      RENDA_VARIAVEL_SESSION_COOKIE_NAME: ${RENDA_VARIAVEL_SESSION_COOKIE_NAME:-controle_renda_variavel_session}
      RTD_STALE_AFTER_SECONDS: ${RTD_STALE_AFTER_SECONDS:-30}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      REMOTE_COLLECTOR_ENABLED: ${REMOTE_COLLECTOR_ENABLED:-false}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
    secrets:
      - secret_key
      - postgres_app_password
      - collector_agent_read_token
      - collector_agent_write_token
      - patrimonio_token
    ports:
      - "127.0.0.1:5301:5003"
    depends_on:
      db:
        condition: service_healthy
      db-provision:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:5003/health', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=2)"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

  migrate:
    # Mesma imagem do `web` (ver comentario la em cima): os dois constroem o
    # mesmo estagio `runtime`, e nomear igual evita construir duas vezes.
    image: controle-renda-variavel:local
    build:
      context: .
      target: runtime
      secrets:
        - local_ca
    read_only: true
    cpus: 0.5
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    pids_limit: 64
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: America/Sao_Paulo
      SECRET_KEY_FILE: /run/secrets/secret_key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: investimentos
      POSTGRES_USER: investimentos
    secrets:
      - secret_key
      - postgres_password
    depends_on:
      db:
        condition: service_healthy
      db-provision:
        condition: service_completed_successfully
    command: ["flask", "--app", "app:create_app", "db", "upgrade"]

  # Provisiona de forma idempotente o usuário que atende a aplicação. O
  # superusuário só aparece neste serviço e no `migrate`; nunca é montado no
  # `web`. O script é o mesmo no Docker Desktop e no VPS.
  db-provision:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: postgres
    read_only: true
    cpus: 0.5
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=16m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: investimentos
      DB_ADMIN_USER: investimentos
      DB_ADMIN_PASSWORD_FILE: /run/secrets/postgres_password
      DB_APP_USER: investimentos_app
      DB_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - postgres_password
      - postgres_app_password
    volumes:
      - ./scripts/provision-db-runtime.sh:/usr/local/bin/provision-db-runtime.sh:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/usr/local/bin/provision-db-runtime.sh"]

  # Banco EFÊMERO da suíte.
  #
  # Não é o `db` de cima, e isso é deliberado: a suíte aplica migrações e grava,
  # e não pode ter caminho até o volume com dados reais nem por engano. Sem
  # volume nomeado -- os dados vivem em tmpfs e somem com o contêiner.
  #
  # `uid=70,gid=70,mode=0700` no tmpfs de dados: ele nasce pertencendo ao root,
  # e o `initdb` roda como `postgres` com `cap_drop: ALL`, sem CAP_CHOWN nem
  # CAP_FOWNER para tomar posse. 70 é o uid do postgres nesta imagem.
  #
  # O arquivo `.secrets/postgres_password_quality` precisa ser LEGÍVEL PELO UID 70: um
  # segredo de arquivo é montado preservando dono e modo do host, e `uid`/`gid`/
  # `mode` na sintaxe longa são ignorados fora do Swarm. Com 0600 de outro dono,
  # este contêiner morre no arranque e o `quality` só reporta "dependency failed
  # to start". No Docker Desktop do Windows não aparece: lá tudo chega 0777.
  db-teste:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["quality"]
    user: postgres
    cpus: 1.0
    mem_limit: 512m
    read_only: true
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m
      - /var/lib/postgresql/data:rw,nosuid,nodev,mode=0700,uid=70,gid=70,size=512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: investimentos
      POSTGRES_USER: investimentos
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password_quality
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets:
      - postgres_password_quality
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investimentos -d investimentos"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-teste-provision:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["quality"]
    user: postgres
    read_only: true
    cpus: 0.5
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=16m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      DB_HOST: db-teste
      DB_PORT: "5432"
      DB_NAME: investimentos
      DB_ADMIN_USER: investimentos
      DB_ADMIN_PASSWORD_FILE: /run/secrets/postgres_password_quality
      DB_APP_USER: investimentos_app
      DB_APP_PASSWORD_FILE: /run/secrets/postgres_app_password_quality
    secrets:
      - postgres_password_quality
      - postgres_app_password_quality
    volumes:
      - ./scripts/provision-db-runtime.sh:/usr/local/bin/provision-db-runtime.sh:ro
    depends_on:
      db-teste:
        condition: service_healthy
    command: ["sh", "/usr/local/bin/provision-db-runtime.sh"]

  quality:
    build:
      context: .
      target: quality
      secrets:
        - local_ca
    # OS NOMES TÊM PREFIXO `TESTE_` DE PROPÓSITO, e não são `POSTGRES_HOST` e
    # companhia.
    #
    # A suíte tem testes que medem o que a aplicação faz quando uma variável
    # NÃO existe -- `test_producao_recusa_secret_key_ausente` e
    # `test_producao_recusa_database_url_ausente`, entre outros. Eles apagam a
    # variável com `monkeypatch.delenv` e esperam a recusa. Uma primeira versão
    # deste serviço declarava `SECRET_KEY_FILE` e `POSTGRES_*` com os nomes
    # reais, e seis testes passaram a falhar: o app encontrava pelo arquivo o
    # que o teste tinha acabado de apagar do ambiente.
    #
    # Com prefixo, o ambiente da suíte continua exatamente como era, e só a
    # fixture `app_com_banco` enxerga estes valores.
    environment:
      TESTE_POSTGRES_HOST: db-teste
      TESTE_POSTGRES_PORT: "5432"
      TESTE_POSTGRES_DB: investimentos
      TESTE_POSTGRES_USER: investimentos_app
      TESTE_POSTGRES_ADMIN_USER: investimentos
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    pids_limit: 256
    secrets:
      - postgres_password_quality
      - postgres_app_password_quality
    depends_on:
      db-teste:
        condition: service_healthy
      db-teste-provision:
        condition: service_completed_successfully
    profiles: ["quality"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

secrets:
  local_ca:
    file: .certs/local-root-ca.crt
  secret_key:
    file: .secrets/secret_key
  postgres_password:
    file: .secrets/postgres_password
  postgres_password_quality:
    file: .secrets/postgres_password_quality
  postgres_app_password:
    file: .secrets/postgres_app_password
  postgres_app_password_quality:
    file: .secrets/postgres_app_password_quality
  collector_agent_read_token:
    file: .secrets/collector_agent_read_token
  collector_agent_write_token:
    file: .secrets/collector_agent_write_token
  patrimonio_token:
    file: .secrets/patrimonio_token
