name: controle-renda-variavel

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: investimentos
      POSTGRES_USER: investimentos
      POSTGRES_PASSWORD: investimentos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investimentos -d investimentos"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://investimentos:investimentos@db:5432/investimentos
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      RTD_STALE_AFTER_SECONDS: ${RTD_STALE_AFTER_SECONDS:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  postgres_data:
    name: controleinvestimentos_postgres_data
