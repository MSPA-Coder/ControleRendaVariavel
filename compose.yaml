name: controle-renda-variavel

services:
  db:
    image: postgres:17-alpine
    user: postgres
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    read_only: true
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: investimentos
      POSTGRES_USER: investimentos
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5302:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investimentos -d investimentos"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    # Nome fixo em vez do derivado do diretorio. Sem isto o Compose batiza a
    # imagem a partir do nome da pasta, que muda conforme onde o repositorio
    # foi clonado -- no CI seria um nome, no VPS outro. A varredura de
    # vulnerabilidade precisa apontar para uma imagem por NOME, e nome que
    # depende do caminho do checkout nao serve de alvo.
    image: controle-renda-variavel:local
    build:
      context: .
      target: runtime
      secrets:
        - local_ca
        - github_token
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      COLLECTOR_AGENT_TOKEN_FILE: /run/secrets/collector_agent_token
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: investimentos
      POSTGRES_USER: investimentos
      RENDA_VARIAVEL_SESSION_COOKIE_NAME: ${RENDA_VARIAVEL_SESSION_COOKIE_NAME:-controle_renda_variavel_session}
      RTD_STALE_AFTER_SECONDS: ${RTD_STALE_AFTER_SECONDS:-30}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      REMOTE_COLLECTOR_ENABLED: ${REMOTE_COLLECTOR_ENABLED:-false}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
    secrets:
      - secret_key
      - postgres_password
      - collector_agent_token
    ports:
      - "127.0.0.1:5301:5003"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:5003/health', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=2)"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

  migrate:
    # Mesma imagem do `web` (ver comentario la em cima): os dois constroem o
    # mesmo estagio `runtime`, e nomear igual evita construir duas vezes.
    image: controle-renda-variavel:local
    build:
      context: .
      target: runtime
      secrets:
        - local_ca
        - github_token
    read_only: true
    cpus: 0.5
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    pids_limit: 64
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: investimentos
      POSTGRES_USER: investimentos
    secrets:
      - secret_key
      - postgres_password
    depends_on:
      db:
        condition: service_healthy
    command: ["flask", "--app", "app:create_app", "db", "upgrade"]

  # Banco EFÊMERO da suíte.
  #
  # Não é o `db` de cima, e isso é deliberado: a suíte aplica migrações e grava,
  # e não pode ter caminho até o volume com dados reais nem por engano. Sem
  # volume nomeado -- os dados vivem em tmpfs e somem com o contêiner.
  #
  # `uid=70,gid=70,mode=0700` no tmpfs de dados: ele nasce pertencendo ao root,
  # e o `initdb` roda como `postgres` com `cap_drop: ALL`, sem CAP_CHOWN nem
  # CAP_FOWNER para tomar posse. 70 é o uid do postgres nesta imagem.
  #
  # O arquivo `.secrets/postgres_password` precisa ser LEGÍVEL PELO UID 70: um
  # segredo de arquivo é montado preservando dono e modo do host, e `uid`/`gid`/
  # `mode` na sintaxe longa são ignorados fora do Swarm. Com 0600 de outro dono,
  # este contêiner morre no arranque e o `quality` só reporta "dependency failed
  # to start". No Docker Desktop do Windows não aparece: lá tudo chega 0777.
  db-teste:
    image: postgres:17-alpine
    profiles: ["quality"]
    user: postgres
    cpus: 1.0
    mem_limit: 512m
    read_only: true
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m
      - /var/lib/postgresql/data:rw,nosuid,nodev,mode=0700,uid=70,gid=70,size=512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: investimentos
      POSTGRES_USER: investimentos
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investimentos -d investimentos"]
      interval: 3s
      timeout: 3s
      retries: 20

  quality:
    build:
      context: .
      target: quality
      secrets:
        - local_ca
        - github_token
    # OS NOMES TÊM PREFIXO `TESTE_` DE PROPÓSITO, e não são `POSTGRES_HOST` e
    # companhia.
    #
    # A suíte tem testes que medem o que a aplicação faz quando uma variável
    # NÃO existe -- `test_producao_recusa_secret_key_ausente` e
    # `test_producao_recusa_database_url_ausente`, entre outros. Eles apagam a
    # variável com `monkeypatch.delenv` e esperam a recusa. Uma primeira versão
    # deste serviço declarava `SECRET_KEY_FILE` e `POSTGRES_*` com os nomes
    # reais, e seis testes passaram a falhar: o app encontrava pelo arquivo o
    # que o teste tinha acabado de apagar do ambiente.
    #
    # Com prefixo, o ambiente da suíte continua exatamente como era, e só a
    # fixture `app_com_banco` enxerga estes valores.
    environment:
      TESTE_POSTGRES_HOST: db-teste
      TESTE_POSTGRES_PORT: "5432"
      TESTE_POSTGRES_DB: investimentos
      TESTE_POSTGRES_USER: investimentos
      TESTE_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      db-teste:
        condition: service_healthy
    profiles: ["quality"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

secrets:
  local_ca:
    file: .certs/local-root-ca.crt
  # PAT de acesso restrito (somente-leitura, só no repositório SharedAuth) --
  # usado apenas durante o build, para o `pip install` de `pyproject.toml`
  # baixar a dependência Git privada. Nunca vira variável de ambiente do
  # runtime nem fica na imagem final. Mesmo token já usado no MegaSena.
  github_token:
    file: .secrets/github_token.txt
  secret_key:
    file: .secrets/secret_key
  postgres_password:
    file: .secrets/postgres_password
  collector_agent_token:
    file: .secrets/collector_agent_token
