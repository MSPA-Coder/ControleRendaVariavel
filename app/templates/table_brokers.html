{% extends "base.html" %}
{% block title %}Corretoras{% endblock %}
{% block content %}
<section class="catalog-card">
  <h2>Corretoras</h2>
  <form class="catalog-create broker-fields" method="post" action="{{ url_for('portfolio.create_broker') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nome<input required maxlength="40" name="name"></label>
    <label>Sigla<input required maxlength="40" name="acronym"></label>
    <button class="button button-primary" type="submit">Adicionar</button>
  </form>
  <div class="table-wrap">
    <table class="catalog-table">
      <thead><tr><th>Nome</th><th>Sigla</th><th>Ações</th></tr></thead>
      <tbody>
      {% for broker in brokers %}
        <tr>
          <td>
            <form id="broker-{{ broker.id }}" method="post" action="{{ url_for('portfolio.update_broker', broker_id=broker.id) }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <input required maxlength="40" name="name" value="{{ broker.name }}" aria-label="Nome da corretora {{ broker.name }}">
            </form>
          </td>
          <td><input required maxlength="40" name="acronym" value="{{ broker.acronym }}" form="broker-{{ broker.id }}" aria-label="Sigla da corretora {{ broker.name }}"></td>
          <td class="catalog-actions">
            <button class="button" type="submit" form="broker-{{ broker.id }}">Salvar</button>
            <form method="post" action="{{ url_for('portfolio.delete_broker', broker_id=broker.id) }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button class="button button-danger" type="submit">Excluir</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="3" class="empty">Nenhuma corretora cadastrada.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
