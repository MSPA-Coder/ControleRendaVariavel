{% extends "base.html" %}
{% block title %}Transações{% endblock %}
{% block header_controls %}
<form class="filters header-controls" method="get"
      hx-get="{{ url_for('portfolio.transactions') }}"
      hx-trigger="change"
      hx-target="#transactions-results"
      hx-swap="outerHTML"
      hx-push-url="true">
  <label>Status
    <select name="status">
      <option value="all" {{ 'selected' if selected_status == 'all' }}>Todas</option>
      {% for status in transaction_statuses %}
        <option value="{{ status.value }}" {{ 'selected' if selected_status == status.value }}>{{ 'Abertas' if status.value == 'open' else 'Fechadas' }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Corretora
    <select name="broker">
      <option value="">Todas</option>
      {% for broker in brokers %}
        <option value="{{ broker.name }}" {{ 'selected' if broker.name == selected_broker }}>{{ broker.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Posição
    <select name="position_kind">
      <option value="all" {{ 'selected' if selected_kind == 'all' }}>Todas</option>
      {% for kind in position_kinds %}
        <option value="{{ kind.value }}" {{ 'selected' if selected_kind == kind.value }}>{{ 'Real' if kind.value == 'real' else 'Hipotética' }}</option>
      {% endfor %}
    </select>
  </label>
  <a class="button" href="{{ url_for('portfolio.transactions') }}">Limpar</a>
</form>
<a class="button button-primary" href="{{ url_for('portfolio.new_transaction') }}">Nova transação</a>
{% endblock %}
{% block content %}
{% include "partials/transactions_results.html" %}
{% endblock %}
