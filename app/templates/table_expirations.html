{% extends "base.html" %}
{% block title %}Vencimentos{% endblock %}
{% block content %}
<section class="catalog-card">
  <h2>Vencimentos de calls e puts</h2>
  <form class="catalog-create expiration-fields" method="post" action="{{ url_for('options.create_expiration') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Call<input required maxlength="5" name="call_code" placeholder="2027A"></label>
    <label>Put<input required maxlength="5" name="put_code" placeholder="2027M"></label>
    <label>Exercício<input required type="date" name="exercise_date"></label>
    <button class="button button-primary" type="submit">Adicionar</button>
  </form>
  <div class="table-wrap">
    <table class="catalog-table">
      <thead><tr><th>Call</th><th>Put</th><th>Exercício</th><th>Ações</th></tr></thead>
      <tbody>
      {% for expiration in expirations %}
        <tr>
          <td>
            <form id="expiration-{{ expiration.id }}" method="post" action="{{ url_for('options.update_expiration', expiration_id=expiration.id) }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <input required maxlength="5" name="call_code" value="{{ expiration.call_code }}" aria-label="Código call {{ expiration.call_code }}">
            </form>
          </td>
          <td><input required maxlength="5" name="put_code" value="{{ expiration.put_code }}" form="expiration-{{ expiration.id }}" aria-label="Código put {{ expiration.put_code }}"></td>
          <td><input required type="date" name="exercise_date" value="{{ expiration.exercise_date.isoformat() }}" form="expiration-{{ expiration.id }}" aria-label="Exercício {{ expiration.call_code }}"></td>
          <td class="catalog-actions">
            <button class="button" type="submit" form="expiration-{{ expiration.id }}">Salvar</button>
            <form method="post" action="{{ url_for('options.delete_expiration', expiration_id=expiration.id) }}" hx-boost="true" hx-confirm="Excluir o vencimento {{ expiration.call_code }}?"
                  data-sa-titulo="Excluir vencimento" data-sa-severidade="error">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button class="button button-danger" type="submit">Excluir</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="4" class="empty">Nenhum vencimento cadastrado.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
