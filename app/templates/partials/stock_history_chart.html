<section class="position-detail-section">
  <h2>Fechamentos históricos</h2>
  <nav class="quote-chart-periods" aria-label="Período do gráfico">
    {% for chave, rotulo in periodos %}
    <a class="button{{ ' button-primary' if chave == periodo }}" href="{{ url_for('portfolio.position_detail', position_id=position.id, periodo=chave, **navigation_args) }}"{{ ' aria-current="true"'|safe if chave == periodo }}>{{ rotulo }}</a>
    {% endfor %}
  </nav>
  {% if grafico %}
  <figure class="quote-chart">
    <svg viewBox="0 0 {{ grafico.largura }} {{ grafico.altura }}" role="img" aria-label="Variação dos fechamentos de {{ position.ticker }} em escala logarítmica">
      {% for marca in grafico.eixo_y %}
      <line class="quote-chart-grid" x1="{{ grafico.esquerda }}" x2="{{ grafico.direita }}" y1="{{ marca.y }}" y2="{{ marca.y }}"></line>
      <text class="quote-chart-axis quote-chart-axis-y" x="{{ grafico.esquerda|int - 6 }}" y="{{ marca.y }}">{{ marca.valor|currency(position.currency) }}</text>
      {% endfor %}
      {% for marca in grafico.eixo_x %}
      <text class="quote-chart-axis quote-chart-axis-x" x="{{ marca.x }}" y="{{ grafico.base|int + 18 }}">{{ marca.rotulo }}</text>
      {% endfor %}
      <polyline class="quote-chart-line" points="{{ grafico.pontos }}"></polyline>
      {% for aporte in grafico.aportes %}
      <polyline class="quote-chart-entry quote-chart-entry-{{ aporte.cor }}" points="{{ aporte.pontos }}"><title>{{ aporte.rotulo }}</title></polyline>
      {% endfor %}
      {% if grafico.pontos_custo %}
      <polyline class="quote-chart-cost" points="{{ grafico.pontos_custo }}"><title>Custo médio da posição</title></polyline>
      {% endif %}
    </svg>
    <figcaption>
      Escala logarítmica. De {{ grafico.minimo|currency(position.currency, trim=true) }} a {{ grafico.maximo|currency(position.currency, trim=true) }} em {{ fechamentos|length }} fechamentos desde {{ fechamentos[0].recorded_date|udate }}.
      <ul class="quote-chart-legend">
        <li><svg class="quote-chart-swatch" viewBox="0 0 28 8" aria-hidden="true"><line class="quote-chart-cost" x1="0" y1="4" x2="28" y2="4"></line></svg>Custo médio, hoje <span data-sensitive-value="true">{{ position.average_cost|currency(position.currency, trim=true) }}</span></li>
        {% for aporte in grafico.aportes %}
        <li><svg class="quote-chart-swatch" viewBox="0 0 28 8" aria-hidden="true"><line class="quote-chart-entry quote-chart-entry-{{ aporte.cor }}" x1="0" y1="4" x2="28" y2="4"></line></svg>{{ aporte.rotulo }} a <span data-sensitive-value="true">{{ aporte.preco|currency(position.currency, trim=true) }}</span></li>
        {% endfor %}
      </ul>
    </figcaption>
  </figure>
  {% else %}
  <p class="empty">Não há fechamentos suficientes neste período para desenhar o gráfico.</p>
  {% endif %}
</section>
