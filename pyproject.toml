[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controle-renda-variavel"
version = "1.7.0"
description = "Controle de renda variável com ações, opções e cotações RTD."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "Flask==3.1.3",
  "Flask-Limiter==3.12",
  "Flask-Login==0.6.3",
  "Flask-Migrate==4.1.0",
  "Flask-SQLAlchemy==3.1.1",
  "Flask-Talisman==1.1.0",
  "Flask-WTF==1.2.2",
  "gunicorn==23.0.0",
  "psycopg[binary]==3.2.13",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "coverage==7.15.2",
  "mypy==1.17.0",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "ruff==0.12.5",
  "types-pywin32==312.0.0.20260724",
]
rtd = [
  "comtypes==1.4.16; sys_platform == 'win32'",
  "pywin32==311; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Risk classification required by AGENTS.md 1.3 ("Classificação, manutenção e
# falhas encontradas"): every test belongs to at least one of these
# categories, so CI can run the critical subset first and preserve a later
# full-validation stage.
markers = [
  "critical: money, integrity, transactions, migrations, authorization or security controls that must never regress.",
  "business_rule: domain/business-rule correctness not already covered by 'critical'.",
  "security: authentication, authorization, CSRF and session controls.",
  "migration_persistence: Alembic migrations and PostgreSQL persistence guarantees.",
  "observable_contract: HTTP/JSON API contracts consumed by clients or the frontend.",
  "interface_smoke: markup, navigation and template-rendering smoke checks.",
  "architecture: process supervision, service boundaries and structural contracts.",
  "e2e: end-to-end browser journeys across critical flows.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
# comtypes is Windows-only: on a Windows dev machine it is installed but
# unstubbed (import-untyped); on Linux CI it is not installed at all
# (import-not-found). This override keeps `mypy app` meaningful on both
# platforms without inline ignores that are only correct on one of them.
module = "comtypes.*"
ignore_missing_imports = true
