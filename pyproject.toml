[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controle-renda-variavel"
version = "1.9.0"
description = "Controle de renda variável com ações, opções e cotações RTD."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "Flask==3.1.3",
  "Flask-Limiter==3.12",
  "Flask-Login==0.6.3",
  "Flask-Migrate==4.1.0",
  "Flask-SQLAlchemy==3.1.1",
  "Flask-Talisman==1.1.0",
  "Flask-WTF==1.2.2",
  "gunicorn==23.0.0",
  "psycopg[binary]==3.2.13",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "coverage==7.15.2",
  "mypy==1.17.0",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-xdist==3.8.0",
  "ruff==0.12.5",
  "types-pywin32==312.0.0.20260724",
]
rtd = [
  "comtypes==1.4.16; sys_platform == 'win32'",
  "pywin32==311; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Um marcador só existe quando algum comando seleciona por ele; classificar
# por classificar produz rótulo que ninguém consulta. Ver "Classificação de
# testes" no AGENTS.md.
markers = [
  "critical: dinheiro, integridade, transações, migrações e autorização. Roda primeiro na CI e nunca é removido para reduzir volume.",
  "security: autenticação, autorização, CSRF e sessão. Roda sempre que a mudança alcança essas áreas.",
  "smoke: marcação, navegação e renderização. Roda quando templates ou estáticos mudam; pode ser consolidado quando redundante.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
# comtypes is Windows-only: on a Windows dev machine it is installed but
# unstubbed (import-untyped); on Linux CI it is not installed at all
# (import-not-found). This override keeps `mypy app` meaningful on both
# platforms without inline ignores that are only correct on one of them.
module = "comtypes.*"
ignore_missing_imports = true
