[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controle-renda-variavel"
version = "1.0.0"
description = "Controle de renda variável com ações, opções e cotações RTD."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "Flask==3.1.1",
  "Flask-Migrate==4.1.0",
  "Flask-SQLAlchemy==3.1.1",
  "Flask-WTF==1.2.2",
  "gunicorn==23.0.0",
  "psycopg[binary]==3.2.13",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.0",
  "pip-audit==2.9.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.5",
  "types-pywin32==312.0.0.20260724",
]
rtd = [
  "comtypes==1.4.16; sys_platform == 'win32'",
  "pywin32==311; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations"]
