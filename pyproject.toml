[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "controle-renda-variavel"
version = "2.2.0"
description = "Controle de renda variável com ações, opções e cotações RTD."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.4,<2",
  "Flask>=3.1.3,<4",
  "Flask-Limiter>=3.12,<5",
  "Flask-Login>=0.6.3,<1",
  "Flask-Migrate>=4.1.0,<5",
  "Flask-SQLAlchemy>=3.1.1,<4",
  "Flask-WTF>=1.2.2,<2",
  # Alinhado com os irmaos (o Django usa >=26,<27; o MegaSena, >=25.1,<27).
  # O piso na familia 25 e o que torna `--no-control-socket` disponivel, flag
  # que este era o unico projeto a nao passar no comando do gunicorn.
  "gunicorn>=25.1,<27",
  "psycopg[binary]>=3.2.13,<4",
  "pydantic>=2.13.4,<3",
  # Sessão, CSRF, rate-limit no login, controle de acesso, hash de senha,
  # cabeçalhos de segurança, formatação em pt-BR e rota de saúde
  # compartilhados com os outros apps do mantenedor. Tag fixada manualmente;
  # nunca aponta para branch.
  #
  # O extra `[flask]` é obrigatório a partir da v0.2.0: o núcleo do pacote
  # deixou de depender de Flask (para o ControleBancario, que é Django, poder
  # instalar só a parte de Python puro) e sem o extra o Flask não vem junto.
  "sharedauth[flask] @ git+https://github.com/MSPA-Coder/SharedAuth.git@v0.7.0",
]

[project.optional-dependencies]
# Instaladas apenas no estagio `quality` da imagem, nunca no `runtime`.
# `pip-audit`: auditoria de CVE das dependências instaladas. Piso na minor
# atual, teto na próxima major — política de faixa do mantenedor.
dev = ["ruff>=0.12.5,<1", "pytest>=8.3.5,<10", "pip-audit>=2.10,<3"]
rtd = [
  "comtypes>=1.4.16,<2; sys_platform == 'win32'",
  "pywin32>=311,<400; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# `sharedauth` é referência direta a um repositório Git (não um índice PyPI) --
# Hatchling recusa isso por padrão, exige este opt-in explícito.
[tool.hatch.metadata]
allow-direct-references = true

# A secao [tool.ruff] e comum aos quatro projetos do mantenedor; so
# `target-version` e `known-first-party` variam, porque dependem da versao de
# Python da imagem e do layout de pacotes. Mantenha o resto em sincronia.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "backups", "instance"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # comprimento de linha: responsabilidade do formatador
]

[tool.ruff.lint.isort]
known-first-party = ["app", "migrations", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
# Alembic gera expressões de schema longas; quebrá-las manualmente só reduz a
# legibilidade da baseline sem mudar o banco criado.
"migrations/versions/*.py" = ["E501", "I001"]
# A ponte RTD implementa uma interface COM do Excel: os nomes dos métodos e das
# propriedades são ditados pela API do lado do Windows, não escolhidos aqui.
# Renomeá-los para snake_case quebraria a integração.
"app/rtd_direct.py" = ["N802", "N803", "N806"]
# `Bucket = tuple[int, str]` é um alias de tipo; PascalCase é a convenção para
# aliases e o N806 não distingue alias de variável comum.
"app/option_portfolio.py" = ["N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
# Sem isto o pytest coloca `tests/` no sys.path em vez da raiz, e `import app`
# falha dentro do conteiner.
pythonpath = ["."]
