name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure disposable runtime values
        run: |
          printf '%s\n' 'POSTGRES_PASSWORD=ci-only-not-a-real-password' 'SECRET_KEY=ci-only-not-a-real-secret' > .env

      - name: Validate Compose configuration
        run: docker compose --profile test config --quiet

      - name: Build Docker images
        run: docker compose --profile test build

      - name: Quality checks
        run: docker compose --profile test run --rm quality

      # Anel 4 (AGENTS.md, "Estratégia de validação progressiva"): a CI é o
      # lugar dos controles de ambiente. O subconjunto crítico roda primeiro,
      # sem instrumentação e com falha rápida, para que uma regressão em
      # controle crítico seja diagnosticada antes da execução completa.
      - name: Critical test controls
        run: docker compose --profile test run --rm test pytest -q -x --tb=short -m critical -n 4

      # Sem filtros parciais e com cobertura. Cada worker do pytest-xdist usa
      # um banco próprio, criado sob demanda a partir de TEST_DATABASE_URL.
      - name: Test suite (full)
        run: docker compose --profile test run --rm test

      - name: Runtime smoke test
        run: |
          docker compose up -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:5003/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean Docker resources
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
