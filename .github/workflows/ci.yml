name: CI

on:
  push:
    branches: [main]
  # Sem filtro de `branches`, de proposito: assim a verificacao roda em PR para
  # QUALQUER base, e nao so para `main`.
  #
  # Com o filtro, um PR empilhado sobre outro branch nao disparava check
  # nenhum -- e o sintoma e a ausencia de sinal, nao um vermelho: a pagina do
  # PR fica limpa e parece aprovada. Aconteceu na fase F1.
  #
  # O `push` acima continua restrito a `main`: o que interessa la e o estado
  # do branch que a producao espelha.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "11 4 * * 2"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Criar CA efêmera para o build
        run: |
          umask 077
          mkdir -p .certs .secrets
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout /tmp/local-root-ca.key \
            -out .certs/local-root-ca.crt \
            -subj "/CN=ControleRendaVariavel CI Local CA"
          rm -f /tmp/local-root-ca.key
          printf '%s\n' 'ci-placeholder-not-a-real-secret' > .secrets/secret_key
          printf '%s\n' 'ci-placeholder-not-a-real-password' > .secrets/postgres_password
          printf '%s\n' 'ci-placeholder-not-a-real-app-password' > .secrets/postgres_app_password
          printf '%s\n' 'ci-placeholder-quality-only' > .secrets/postgres_password_quality
          printf '%s\n' 'ci-placeholder-quality-app-only' > .secrets/postgres_app_password_quality
          printf '%s\n' 'ci-placeholder-read-only-token' > .secrets/collector_agent_read_token
          printf '%s\n' 'ci-placeholder-write-only-token' > .secrets/collector_agent_write_token
          printf '%s\n' 'ci-placeholder-patrimonio-token' > .secrets/patrimonio_token
          # O `chmod` na senha do PostgreSQL não é descuido, e o `umask 077`
          # continua valendo para os outros dois arquivos.
          #
          # Um segredo de arquivo do Compose é montado preservando dono e modo
          # do host -- `uid`, `gid` e `mode` na sintaxe longa são ignorados fora
          # do Swarm, e o próprio Compose avisa isso. O contêiner `db-teste`
          # roda como uid 70 e precisa LER esse arquivo para inicializar; com
          # 0600 pertencendo ao runner, ele morre no arranque e o `quality` só
          # reporta "dependency failed to start".
          #
          # Até a fase F1 isso não aparecia porque nenhum contêiner de banco
          # subia neste job. O valor é uma constante pública escrita acima e não
          # protege nada.
          chmod 0644 .secrets/postgres_password
          chmod 0644 .secrets/postgres_app_password
          chmod 0644 .secrets/postgres_password_quality
          chmod 0644 .secrets/postgres_app_password_quality
      - name: Validar Compose
        run: docker compose --profile quality config --quiet
      - name: Construir quality sem cache
        run: docker compose --profile quality build --no-cache quality
      - name: Executar quality
        run: docker compose --profile quality run --rm quality

      # O Dependabot abre PR quando sai versao nova. Nao e a mesma pergunta que
      # "a versao que esta instalada AGORA tem CVE conhecido?" -- e essa segunda
      # ninguem fazia em nenhum dos seis repositorios.
      #
      # Roda dentro da propria imagem `quality`, que ja instala exatamente o que
      # a imagem servida instala, mais as ferramentas de teste. Auditar o
      # ambiente instalado responde a pergunta certa; auditar o arquivo de
      # requisitos responderia sobre o que esta ESCRITO, nao sobre o que esta
      # rodando.
      #
      # Reprova em qualquer achado, de proposito. Vulnerabilidade sem correcao
      # publicada sai por `--ignore-vuln ID` com um comentario dizendo por que:
      # cada excecao vira uma decisao explicita e datada, em vez de um vermelho
      # permanente que se aprende a ignorar.
      # `--cache-dir` em /tmp porque HOME e /app na imagem e /app/.cache nao
      # existe: sem isto o pip-audit morre tentando criar o proprio cache,
      # antes de auditar coisa alguma. Mesmo motivo de RUFF_CACHE_DIR e
      # PYTEST_ADDOPTS ja apontarem para /tmp no Dockerfile.
      - name: Auditar dependencias instaladas (CVE conhecido)
        run: docker compose --profile quality run --rm quality pip-audit --progress-spinner=off --cache-dir /tmp/pip-audit-cache

      - name: Construir a imagem servida
        run: docker compose build web

      # O `pip-audit` acima cobre as dependencias Python. Esta varredura cobre o
      # que ele nao ve: os pacotes do sistema operacional da imagem base.
      #
      # RODA COMO CONTEINER, NAO COMO ACTION. A politica de Actions deste
      # repositorio e `selected` com apenas `github_owned_allowed` -- action de
      # terceiro e barrada antes de o workflow rodar, e o sintoma e
      # `startup_failure` sem log. Conformar-se a politica e melhor que
      # afrouxa-la para caber uma ferramenta.
      #
      # `docker save` + `--input` em vez de montar /var/run/docker.sock: montar
      # o socket do Docker e dar root na pratica, que foi exatamente o motivo
      # de o `autoheal` ter sido recusado no VPS. Nao vale reabrir aqui.
      #
      # Imagem fixada por digest do indice multi-arquitetura, pelo mesmo motivo
      # que as actions sao fixadas por SHA.
      #
      # `--ignore-unfixed` de proposito: CVE de pacote de sistema sem correcao
      # publicada nao e acionavel. Reprovar por ele travaria PR sem relacao
      # nenhuma com o assunto e ensinaria a ignorar o vermelho.
      - name: Varredura de vulnerabilidade da imagem servida
        run: |
          set -euo pipefail
          docker save controle-renda-variavel:local -o "$RUNNER_TEMP/imagem.tar"
          docker run --rm \
            -v "$RUNNER_TEMP:/varredura:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /varredura/imagem.tar \
                  --scanners vuln \
                  --severity HIGH,CRITICAL \
                  --ignore-unfixed \
                  --exit-code 1 \
                  --format table

  runtime-contracts:
    name: Contratos de runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Criar entradas efêmeras do Compose
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .certs .secrets
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout /tmp/local-root-ca.key \
            -out .certs/local-root-ca.crt \
            -subj "/CN=ControleRendaVariavel CI Local CA"
          rm -f /tmp/local-root-ca.key
          printf '%s\n' 'ci-placeholder-not-a-real-secret' > .secrets/secret_key
          printf '%s\n' 'ci-placeholder-not-a-real-password' > .secrets/postgres_password
          printf '%s\n' 'ci-placeholder-not-a-real-app-password' > .secrets/postgres_app_password
          printf '%s\n' 'ci-placeholder-quality-only' > .secrets/postgres_password_quality
          printf '%s\n' 'ci-placeholder-quality-app-only' > .secrets/postgres_app_password_quality
          printf '%s\n' 'ci-placeholder-read-only-token' > .secrets/collector_agent_read_token
          printf '%s\n' 'ci-placeholder-write-only-token' > .secrets/collector_agent_write_token
          printf '%s\n' 'ci-placeholder-patrimonio-token' > .secrets/patrimonio_token
      - name: Validar contrato do PostgreSQL no Compose
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile quality -f compose.yaml config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json

          services = json.load(open("/tmp/compose.json", encoding="utf-8"))["services"]
          db = services["db"]
          assert db["user"] == "postgres"
          assert db["read_only"] is True
          assert db["cap_drop"] == ["ALL"]
          assert db["security_opt"] == ["no-new-privileges:true"]
          assert db["pids_limit"] == 256
          assert db["environment"]["POSTGRES_INITDB_ARGS"] == "--data-checksums"
          assert "/tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m" in db["tmpfs"]
          assert "/var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m" in db["tmpfs"]

          quality = services["quality"]
          assert quality["read_only"] is True
          assert quality["cap_drop"] == ["ALL"]
          assert quality["security_opt"] == ["no-new-privileges:true"]
          assert quality["pids_limit"] == 256
          assert quality["secrets"][0]["source"] == "postgres_password_quality"

          db_teste = services["db-teste"]
          assert db_teste["environment"]["POSTGRES_PASSWORD_FILE"] == "/run/secrets/postgres_password_quality"
          assert db_teste["environment"]["POSTGRES_INITDB_ARGS"] == "--data-checksums"
          assert db_teste["secrets"][0]["source"] == "postgres_password_quality"

          provision = services["db-provision"]
          assert provision["environment"]["DB_APP_USER"] == "investimentos_app"
          assert provision["secrets"][1]["source"] == "postgres_app_password"

          provision_teste = services["db-teste-provision"]
          assert provision_teste["profiles"] == ["quality"]

          web = services["web"]
          assert web["environment"]["POSTGRES_USER"] == "investimentos_app"
          assert web["environment"]["POSTGRES_PASSWORD_FILE"] == "/run/secrets/postgres_app_password"
          assert web["environment"]["COLLECTOR_AGENT_READ_TOKEN_FILE"] == "/run/secrets/collector_agent_read_token"
          assert web["environment"]["COLLECTOR_AGENT_WRITE_TOKEN_FILE"] == "/run/secrets/collector_agent_write_token"
          assert "PATRIMONIO_OWNER_ID" in web["environment"]
          assert web["environment"]["PATRIMONIO_MAX_HISTORICO_DIAS"] == "3650"
          PY
      - name: Construir e inspecionar runtime sem cache
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml build --no-cache web
          image_id="$(docker image inspect --format '{{.Id}}' controle-renda-variavel:local)"
          test -n "$image_id"
          docker run --rm --entrypoint sh "$image_id" -ec '
            test "$(id -u)" != 0
            test ! -w /app
            test ! -w /app/app
            test ! -w /app/migrations
            for path in /app/.secrets /app/.certs /app/.env /app/requirements-dev.txt; do
              test ! -e "$path"
            done
            for tool in gcc make wget; do
              ! command -v "$tool" >/dev/null 2>&1
            done
          '
