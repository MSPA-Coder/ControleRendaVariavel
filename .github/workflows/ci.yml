name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: investimentos
          POSTGRES_PASSWORD: investimentos
          POSTGRES_DB: investimentos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U investimentos -d investimentos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Tests build their schema through the real Alembic migrations against
      # this disposable database (see tests/conftest.py); the app itself is
      # never pointed at it outside of the test suite.
      TEST_DATABASE_URL: postgresql+psycopg://investimentos:investimentos@localhost:5432/investimentos_test
      SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy app

      - name: pytest
        run: pytest

      - name: pip-audit
        run: pip-audit
